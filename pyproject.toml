[project]
name = "aero-mesh-coefficients"
version = "0.2.0"
description = "Research code for aerodynamic geometry-to-mesh-to-coefficients experiments."
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "numpy",
  "pandas",
  "pillow",
  "pytest",
  "scikit-learn",
  "scipy",
  "trimesh",
]

[project.optional-dependencies]
cad = [
  "gmsh",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
